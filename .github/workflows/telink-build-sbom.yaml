#
# Build one Telink Matter example and emit an SPDX / CycloneDX SBOM.
#
# Baseline: SDK v1.1.0.0 (see Matter_Zigbee_Dual_Mode_SDK_Release_Info.pdf, section 2):
#   Matter : telink-semi/tl_matter  dev-tl3238x_prj_v1.6.1  23123f5786f7917427b5b1e985a28b29125bf1db
#   Zephyr : telink-semi/tl_zephyr  dev-tl3238x_prj_v4.1    80de0ea4045869967c6b8e3d86b761955b1c981b
#   BLE SDK: telink-semi/tl_ble_sdk_zephyr                  f50d422d780efb73af939650ef7b8c6bf5a0b99b
#
# The container ships a pre-cloned tl_zephyr; update_zephyr.py pins it to the
# release revision; west update also fetches tl_ble_sdk per west.yml.

name: Telink Build + SBOM

on:
    workflow_dispatch:
        inputs:
            board:
                description: "Zephyr board target"
                required: true
                default: tl3238x_retention
            app:
                description: "Example source dir (relative to repo root)"
                required: true
                default: examples/light-switch-app/telink
    push:
        branches:
            - dev-tl3238x_prj_v1.6.1
            - 'ci/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CHIP_NO_LOG_TIMESTAMPS: true
    TELINK_ZEPHYR_REV: 80de0ea4045869967c6b8e3d86b761955b1c981b
    # tl_ble_sdk is pinned by tl_zephyr west.yml (f50d422d780efb73af939650ef7b8c6bf5a0b99b)
    SBOM_NAMESPACE_PREFIX: https://github.com/${{ github.repository }}

jobs:
    build-sbom:
        name: Build + SBOM (${{ github.event.inputs.board || 'tl3238x_retention' }})
        runs-on: ubuntu-latest

        container:
            # Digest of ghcr.io/project-chip/chip-build-telink:200, the image the
            # v1.6.1 branch's own examples-telink.yaml uses. Pinned by digest so the
            # toolchain cannot shift under a build.
            image: ghcr.io/project-chip/chip-build-telink@sha256:82a785fc06f42a2589415223defd06d1fe6a6ef43148fc3840518b1b23820c9f
            # Mount the host root so .github/actions/maximize-runner-disk can prune
            # dotnet/android/ghc/swift; without this it exits early and the 14 GB
            # runner disk overflows while restoring the 1.5 GB bootstrap cache.
            volumes:
                - "/:/runner-root-volume"

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  # The full history is large; the SBOM only needs the built tree.
                  fetch-depth: 1

            - name: Checkout submodules & Bootstrap
              uses: ./.github/actions/checkout-submodules-and-bootstrap
              with:
                  platform: telink

            - name: Pin Telink Zephyr and modules to the release revision
              run: |
                  scripts/run_in_build_env.sh "python3 scripts/tools/telink/update_zephyr.py $TELINK_ZEPHYR_REV"

            - name: Build example and generate SPDX SBOM
              run: |
                  ./scripts/run_in_build_env.sh "bash scripts/tools/telink/sbom_build.sh '${{ github.event.inputs.board || 'tl3238x_retention' }}' '${{ github.event.inputs.app || 'examples/light-switch-app/telink' }}' 'out/telink-build' 'out/sbom'"

            # The Matter stack is built by GN through ExternalProject_Add, so zspdx
            # (which walks the CMake codemodel) cannot see it. This recovers the real
            # file list from ninja's own execution log.
            - name: Generate Matter source SBOM from the GN build
              run: |
                  GN_OUT=out/telink-build/modules/chip-module
                  REV="$(git rev-parse HEAD)"
                  python3 scripts/tools/telink/gn_sources_to_spdx.py --ninja-log "$GN_OUT/.ninja_log" --compile-db "$GN_OUT/compile_commands.json" --repo-root "$PWD" --out out/sbom/matter-sources.spdx --purl "pkg:github/${GITHUB_REPOSITORY}@$REV" --download-location "git+https://github.com/${GITHUB_REPOSITORY}@$REV" --version "$REV"

            # zspdx lists every module in the west workspace, including the ~50
            # vendor HALs that `west update` fetches but a TL3238 build never
            # compiles. Those are development-environment noise: an SBOM
            # describes the firmware, not the disk. A module is kept when the
            # linker map shows one of its archives or it has compiled files.
            - name: Keep only modules that were actually linked
              run: |
                  python3 scripts/tools/telink/filter_sbom.py --sbom-dir out/sbom --map out/telink-build/zephyr/zephyr.map

            - name: Enrich SBOM for NTIA compliance
              run: |
                  python3 scripts/tools/telink/enrich_sbom.py out/sbom

            - name: Convert SBOM to CycloneDX
              run: |
                  python3 scripts/tools/telink/spdx_to_cyclonedx.py out/sbom/enriched -o out/sbom/telink-matter.cdx.json

            - name: Generate SBOM review artefacts
              run: |
                  python3 scripts/tools/telink/sbom_review.py out/sbom/enriched --out-dir out/sbom/review

            # Prebuilt archives that the linker actually pulled objects from.
            # Listing every .a in every module produced 1281 entries, most of
            # which never reach the firmware; intersect with the linker map.
            - name: List prebuilt archives linked into the firmware
              if: always()
              shell: bash
              run: |
                  mkdir -p out/sbom
                  MAP=out/telink-build/zephyr/zephyr.map
                  grep -oE '[A-Za-z0-9_.-]+\.a\(' "$MAP" 2>/dev/null | sed 's/($//' | sort -u > /tmp/linked-archives.txt
                  find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -path '*/out/*' -prune -o -path '*/.environment/*' -prune -o -type f \( -name '*.a' -o -name '*.lib' \) -print 2>/dev/null > /tmp/all-archives.txt
                  find "$TELINK_ZEPHYR_BASE/.." -path '*/build*' -prune -o -type f \( -name '*.a' -o -name '*.lib' \) -print 2>/dev/null >> /tmp/all-archives.txt
                  {
                    echo "# Prebuilt archives linked into zephyr.elf that are not generated"
                    echo "# by this build. The SBOM covers their sources through the module"
                    echo "# packages; this list is what has to be declared as binary."
                    echo
                    while IFS= read -r f; do
                      b="$(basename "$f")"
                      if grep -qxF "$b" /tmp/linked-archives.txt; then
                        echo "${f#$GITHUB_WORKSPACE/}"
                      fi
                    done < /tmp/all-archives.txt
                  } | sort -u > out/sbom/prebuilt-binaries.txt
                  cat out/sbom/prebuilt-binaries.txt

            - name: Show SBOM summary
              if: always()
              run: |
                  echo "--- SPDX documents ---"
                  ls -la out/sbom 2>/dev/null || echo "(no SBOM directory produced)"
                  for dir in out/sbom out/sbom/enriched; do
                    [ -d "$dir" ] || continue
                    echo "--- $dir ---"
                    printf '%-24s %8s %8s %8s\n' document packages supplier purl
                    for f in "$dir"/*.spdx; do
                      [ -e "$f" ] || continue
                      printf '%-24s %8s %8s %8s\n' "$(basename "$f")" "$(grep -c '^PackageName:' "$f" || true)" "$(grep -c '^PackageSupplier:' "$f" || true)" "$(grep -c '^ExternalRef:.*purl' "$f" || true)"
                    done
                  done

            - name: Upload firmware
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-firmware
                  if-no-files-found: warn
                  path: |
                      out/telink-build/zephyr/zephyr.elf
                      out/telink-build/zephyr/zephyr.bin
                      out/telink-build/zephyr/zephyr.map

            - name: Upload SBOM (raw, as emitted by zspdx)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-spdx-raw
                  if-no-files-found: warn
                  path: out/sbom/*.spdx

            - name: Upload SBOM (enriched, NTIA-complete)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-spdx-enriched
                  if-no-files-found: warn
                  path: out/sbom/enriched/*.spdx

            - name: Upload SBOM (CycloneDX)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-cyclonedx
                  if-no-files-found: warn
                  path: out/sbom/*.cdx.json

            - name: Upload SBOM review artefacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: telink-sbom-review
                  if-no-files-found: warn
                  path: |
                      out/sbom/review/sbom-review.csv
                      out/sbom/review/sbom-gaps.md
                      out/sbom/prebuilt-binaries.txt
